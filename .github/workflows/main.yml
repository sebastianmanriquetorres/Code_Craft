name: CI - Code Craft

on:
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Verificar estructura de archivos (simula una validación)
      - name: List files
        run: ls -la

      # 3. Validación simulada (por ejemplo, verificar que README exista)
      - name: Check for README
        run: |
          if [ -f README.md ]; then
            echo "README.md encontrado ✅"
          else
            echo "❌ No se encontró README.md"
            exit 1
          fi
